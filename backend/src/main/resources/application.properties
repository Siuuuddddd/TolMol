spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
spring.config.import=optional:file:.env[.properties]
tolmol.db.password=${TOLMOL_DB_PASSWORD}
tolmol.jwt.secret=${TOLMOL_JWT_SECRET}
tolmol.db.base=${TOLMOL_DB_BASE:jdbc:postgresql://localhost:15432/}
tolmol.db.user=${TOLMOL_DB_USER:tolmol}
tolmol.push.fcm.enabled=${TOLMOL_PUSH_FCM_ENABLED:false}
tolmol.push.apns.enabled=${TOLMOL_PUSH_APNS_ENABLED:false}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:16379}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB
