[versions]
koin = "4.2.2"
agp = "9.1.1"
kotlin = "2.3.20"
lifecycle = "2.10.0"
coroutines = "1.10.2"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
activity = { module = "androidx.activity:activity-compose", version = "1.13.0" }
material3 = { module = "androidx.compose.material3:material3", version = "1.4.0" }
navigation = { module = "androidx.navigation3:navigation3-ui", version = "1.2.0" }
nav-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version = "3.0.0" }
converter = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version = "3.0.0" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.12.0" }
json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.9.0" }
datastore = { module = "androidx.datastore:datastore-preferences", version = "1.2.1" }
location = { module = "com.google.android.gms:play-services-location", version = "21.3.0" }
tasks = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version = "4.13.2" }
